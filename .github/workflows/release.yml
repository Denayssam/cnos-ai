name: Build and Release VSIX

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Actualizado a v4 para evitar warnings
      
      - name: Use Node.js
        uses: actions/setup-node@v4 # Actualizado a v4
        with:
          node-version: '20.x'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build VSIX
        run: |
          npm install -g @vscode/vsce
          vsce package
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # Actualizado a v2
        with:
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}